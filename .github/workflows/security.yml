name: Security and Windows validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run security:scan
      - run: npm run security:secrets
      - run: npm audit --audit-level=moderate
      - shell: pwsh
        run: New-Item -ItemType Directory -Force "$env:LOCALAPPDATA/hermes/cache/scratch" | Out-Null
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ui
      - run: npm run build:test
      - run: npm run test:clean-machine
      - run: npm run test:corners
      - run: npm run dist
      - run: node scripts/check-release-security.cjs
      - run: node scripts/smoke-production-security.cjs
      - run: node scripts/check-publication.cjs --artifacts
