name: Security and Windows validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    # Hosted Windows Server is build/automation coverage, not a Windows 11 desktop test.
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Record the actual Windows test host
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, BuildNumber, ProductType |
            Format-List
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run security:scan
      - run: npm run security:secrets
      - run: npm audit --audit-level=moderate
      - shell: pwsh
        run: New-Item -ItemType Directory -Force "$env:LOCALAPPDATA/hermes/cache/scratch" | Out-Null
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ui
      - name: Verify native notification-area backend without legacy taskbar manipulation
        run: node scripts/test-tray-native.cjs
      - run: npm run build:test
      - name: Verify dual-quota native images and indicator lifecycle without touching Explorer
        run: node scripts/test-indicator-native.cjs
      - name: Verify quick actions and private diagnostic IPC without touching the clipboard
        run: node scripts/test-diagnostics.cjs
      - name: Verify close, minimize and quit choices in native Electron
        run: node scripts/test-window-close.cjs
      - name: Verify automatic startup stays in the bar and manual opening stays visible
        run: node scripts/test-startup-launch.cjs
      - name: Verify update downloads and checksum rejection without executing an installer
        run: node scripts/test-update-download.cjs
      - name: Verify bundled authentication component with an empty profile
        run: node scripts/test-codex-runtime.cjs
      - run: npm run test:clean-machine
      - run: npm run test:corners
      # Validation is read-only, including on tag pushes; releases are published separately.
      - run: npm run dist -- --publish never
      - name: Verify automatic-update metadata against the actual installer
        run: node scripts/check-update-metadata.cjs
      - shell: powershell
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          & .\scripts\check-windows-icons.ps1 -ExecutablePaths @(
            'release/win-unpacked/Cypher.exe',
            'release/win-unpacked/resources/app.asar.unpacked/dist/native/Cypher.Taskbar.exe',
            "release/Cypher-$version-win-x64.exe",
            "release/Cypher-Setup-$version-win-x64.exe"
          )
      - run: node scripts/check-release-security.cjs
      - run: node scripts/smoke-production-security.cjs
      - run: node scripts/check-publication.cjs --artifacts
      - name: Hash the validated Windows executables
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $names = @("Cypher-Setup-$version-win-x64.exe", "Cypher-$version-win-x64.exe", 'latest.yml')
          $lines = foreach ($name in $names) {
            $hash = (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $lines | Set-Content "release/SHA256SUMS-$version.txt" -Encoding utf8NoBOM
      - name: Upload validated builds (not a GitHub release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cypher-windows-x64-${{ github.sha }}
          path: |
            release/Cypher-*-win-x64.exe
            release/SHA256SUMS-*.txt
            release/latest.yml
          if-no-files-found: error
          retention-days: 7
