name: Security and Windows validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run security:scan
      - run: npm run security:secrets
      - run: npm audit --audit-level=moderate
      - shell: pwsh
        run: New-Item -ItemType Directory -Force "$env:LOCALAPPDATA/hermes/cache/scratch" | Out-Null
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ui
      - run: npm run build:test
      - run: npm run test:clean-machine
      - run: npm run test:corners
      # Validation is read-only, including on tag pushes; releases are published separately.
      - run: npm run dist -- --publish never
      - shell: powershell
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          & .\scripts\check-windows-icons.ps1 -ExecutablePaths @(
            'release/win-unpacked/Cypher.exe',
            'release/win-unpacked/resources/app.asar.unpacked/dist/native/Cypher.Taskbar.exe',
            "release/Cypher-$version-win-x64.exe",
            "release/Cypher-Setup-$version-win-x64.exe"
          )
      - run: node scripts/check-release-security.cjs
      - run: node scripts/smoke-production-security.cjs
      - run: node scripts/check-publication.cjs --artifacts
