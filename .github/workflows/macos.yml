name: macOS validation and builds
on:
  push:
    branches: [main, feat/macos-menu-bar, feat/connection-options]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Ad-hoc signing only: no Apple certificate, keychain or signing secrets.
      # electron-builder otherwise skips even ad-hoc signatures on PR builds.
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: sw_vers && uname -m
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:mac
      - run: npm run security:scan
      - run: npm run build
      - name: Verify bundled authentication component with an empty profile
        run: node scripts/test-codex-runtime.cjs
      - run: node scripts/smoke-mac.cjs
      - name: Verify close, minimize and quit choices in native Electron
        run: node scripts/test-window-close.cjs
      - name: Verify automatic startup stays in the bar and manual opening stays visible
        run: node scripts/test-startup-launch.cjs
      - name: Package macOS preview with an ad-hoc signature (no Apple certificate)
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
      - name: Verify final application signature and launch
        run: node scripts/smoke-mac-package.cjs
        env:
          CYPHER_MAC_APP: release/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/Cypher.app
      - name: Scan packaged application
        run: npm run security:scan -- --artifacts
        env:
          CYPHER_RELEASE_ROOT: release/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/Cypher.app/Contents
      - name: Hash the macOS downloads
        run: cd release && shasum -a 256 Cypher-*-mac-${{ matrix.arch }}.dmg Cypher-*-mac-${{ matrix.arch }}.zip > SHA256SUMS-mac-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cypher-macos-${{ matrix.arch }}-${{ github.sha }}
          path: |
            release/Cypher-*-mac-*.dmg
            release/Cypher-*-mac-*.zip
            release/SHA256SUMS-mac-*.txt
          if-no-files-found: error
          retention-days: 14
