name: Feature request
description: Describe a workflow Cypher could improve.
body:
  - type: markdown
    attributes:
      value: |
        Please write in English where possible and check existing issues first. For a new provider or metric, use the provider request form.
        **NEVER attach API keys, CLI credentials, cookies or private account data.** Review and sanitize every log and screenshot before sharing. For a security concern, read the [security policy](https://github.com/A-Arnaud/Cypher/security/policy).
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: Windows 10 22H2 x64, or N/A if not applicable
    validations:
      required: true
  - type: input
    id: cypher-version
    attributes:
      label: Cypher version
      placeholder: 0.4.9, source commit, or N/A if not yet using Cypher
    validations:
      required: true
  - type: textarea
    id: current-workflow
    attributes:
      label: Current workflow or problem
      description: What are you trying to do today? Describe any workaround; N/A is fine for a new workflow. Reproduction steps are not required.
    validations:
      required: true
  - type: textarea
    id: desired-behavior
    attributes:
      label: Desired behavior
      description: Describe the outcome and why it helps. Include alternatives considered if useful.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs, screenshots or sketches (optional)
      description: Remove secrets, account details, private paths and unrelated content before sharing.
  - type: checkboxes
    id: privacy
    attributes:
      label: Safe sharing confirmation
      options:
        - label: I have checked this request and all attachments contain no API keys, CLI credentials, cookies or private account data.
          required: true
