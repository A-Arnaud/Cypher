name: Provider or metric request
description: Request research into a provider connection or a missing metric.
body:
  - type: markdown
    attributes:
      value: |
        Please write in English where possible. Check the [coverage matrix](https://github.com/A-Arnaud/Cypher/blob/main/docs/catalog-coverage.md) and existing issues first. Implemented means connector code exists for the stated fields, not validation with every live account; partial means some fields or flows exist; planned means not implemented; discovery only means detection or guidance without quota collection. A request does not promise support or a delivery date.
        **NEVER attach API keys, CLI credentials, cookies or private account data.** Describe access requirements without sharing credentials. For a security concern, read the [security policy](https://github.com/A-Arnaud/Cypher/security/policy).
  - type: input
    id: provider
    attributes:
      label: Provider and product
      description: Distinguish chat subscriptions, CLI accounts, API billing and local model servers.
    validations:
      required: true
  - type: dropdown
    id: current-status
    attributes:
      label: Current Cypher coverage
      options:
        - Unknown / not listed
        - Implemented - requesting an additional metric
        - Partial - requesting missing behavior
        - Planned - no connector yet
        - Discovery only - detection or guidance
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system and processor
      placeholder: Windows 10/11 x64 or macOS version + Intel/Apple Silicon; N/A if not applicable
    validations:
      required: true
  - type: input
    id: cypher-version
    attributes:
      label: Cypher version
      placeholder: 0.5.4, source commit, or N/A if not yet using Cypher
    validations:
      required: true
  - type: textarea
    id: workflow-metric
    attributes:
      label: Desired metric and current workflow
      description: Name the metric, units and reset window if known. How do you read it today? N/A is fine for a new workflow; reproduction steps are not required.
    validations:
      required: true
  - type: textarea
    id: official-docs
    attributes:
      label: Official read-only API or CLI documentation
      description: Link official documentation for reading this metric. If no documented read-only interface is known, say so; do not share authenticated URLs or copied account responses.
    validations:
      required: true
  - type: textarea
    id: access
    attributes:
      label: Access requirements (no credentials)
      description: Describe required plan, account role, permission scopes, API or CLI availability and known access restrictions. Unknown is acceptable. Never provide keys, tokens, cookies or account identifiers.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots (optional)
      description: Remove secrets, account details, private paths and unrelated content before sharing. Do not attach account files or raw diagnostic captures.
  - type: checkboxes
    id: privacy
    attributes:
      label: Safe sharing confirmation
      options:
        - label: I have checked this request and all attachments contain no API keys, CLI credentials, cookies or private account data.
          required: true
