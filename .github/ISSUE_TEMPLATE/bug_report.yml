name: Bug report
description: Report unexpected Cypher behavior with safe reproduction details.
body:
  - type: markdown
    attributes:
      value: |
        Please write in English where possible and check existing issues first.
        **NEVER attach API keys, CLI credentials, cookies or private account data.** Review and sanitize every log and screenshot before sharing. For a security concern, read the [security policy](https://github.com/A-Arnaud/Cypher/security/policy).
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: Windows 10 22H2 x64; include display scaling if relevant
    validations:
      required: true
  - type: input
    id: cypher-version
    attributes:
      label: Cypher version and install type
      placeholder: 0.4.9 installed / portable / source checkout with commit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the affected view or provider, without account identifiers.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual behavior
      description: What should happen, and what happened instead? Include any visible error text after removing private data.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots (optional)
      description: Share only the minimum useful evidence. Remove secrets, account details, private paths and unrelated content; do not attach raw account or diagnostic files.
  - type: checkboxes
    id: privacy
    attributes:
      label: Safe sharing confirmation
      options:
        - label: I have checked this report and all attachments contain no API keys, CLI credentials, cookies or private account data.
          required: true
